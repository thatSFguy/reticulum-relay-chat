name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # One place to change the target list. Each entry is
  # goos/goarch/goarm/name — goarm is empty for non-ARM targets.
  #   Windows            x86-64
  #   Linux              x86-64
  #   Raspberry Pi 3/4/5 64-bit OS   (arm64)
  #   Raspberry Pi 2/3/4 32-bit OS   (armv7)
  #   Raspberry Pi 1/Zero/Zero W     (armv6)
  TARGETS: >-
    windows/amd64//windows-amd64
    linux/amd64//linux-amd64
    linux/arm64//linux-arm64
    linux/arm/7/linux-armv7
    linux/arm/6/linux-armv6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go test ./... -count=1
      - run: go test ./internal/hub/ ./internal/history/ ./internal/peerreg/ ./internal/service/ -race -count=1

  # Proves every shipped target still cross-compiles. Deliberately does
  # NOT gate the release: see the release job.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile every target
        run: .github/build-targets.sh "${GITHUB_REF_NAME}"
      - name: Upload binaries
        # Artifact storage is an account-wide quota that other repos can
        # exhaust, and a full quota must not turn a green build red — the
        # binaries that matter are attached to the release, which does not
        # use artifact storage at all.
        continue-on-error: true
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rrc-hub-binaries
          path: dist/*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Builds here rather than downloading what the build job made.
      # Passing binaries between jobs costs an artifact upload, and that
      # quota is shared across the whole account — a release must not be
      # blocked by an unrelated repo filling it up. Release assets have
      # no such limit.
      - name: Cross-compile every target
        run: .github/build-targets.sh "${GITHUB_REF_NAME}"
      # Ship the example config alongside the binaries. Config keys move
      # between versions, so pairing a released binary with whatever is
      # currently at the tip of a branch is how someone ends up debugging
      # a key their build does not have.
      - name: Stage the example config
        run: cp configs/rrc-hub.example.toml dist/
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
