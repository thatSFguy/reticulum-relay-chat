# Example configuration for the Reticulum Relay Chat hub (rrc-hub).
# Copy to rrc-hub.toml and edit, then run:  rrc-hub -config rrc-hub.toml
#
# Every key below shows its default in the trailing comment. Keys you
# omit keep their default — only [[interfaces]] is mandatory.
#
# CLI overrides (apply only when the flag is passed):
#   -identity PATH   overrides hub.identity_path
#   -hub-name NAME   overrides hub.name
#   -no-announce     forces hub.announce_on_start = false

[hub]
# Display name shown to clients in the WELCOME message. (default "RRC Hub")
name = "thatSFguy"

# Software version string advertised in WELCOME. Leave it commented out
# and the hub advertises its own build version, which is what you almost
# certainly want. Set it only to advertise something else.
# version = "rrc-hub-go/1.2.3"

# Optional message-of-the-day, delivered as NOTICE(s) right after
# WELCOME. Text over 512 bytes is sent as an RNS Resource when resource
# transfer is enabled, otherwise chunked into MTU-sized NOTICEs. Leave
# empty to disable. (default "")
# The default says what this hub is, because it is not what someone
# connecting will assume: history arrives as ordinary replayed messages
# and a mention notification arrives somewhere else entirely, so both are
# invisible unless you know to look. Replace it with your own words —
# just keep telling people what they can do here.
greeting = """
Welcome. This is rrc-hub by thatSFguy - RRC, plus some things a standard hub does not do:
  - rooms open with the recent conversation, not a blank screen
  - name someone with @nick while they are away and the hub delivers it to their LXMF inbox, so they actually find out
None of it needs a special client - your existing one already speaks everything used here.
/join #lobby to start, /help for commands."""

# Where the hub's long-term Reticulum identity is stored. Created on
# first run if it does not exist. The destination hash clients add is
# derived from this identity + the rrc.hub aspect. (default "hub_identity")
#
# With mention_lxmf on the hub keeps a SECOND identity beside this one,
# for its notification address only — see lxmf_identity_path. Back up
# both, or clients lose the hub and recipients lose the sender.
identity_path = "hub_identity"

# RNS destination aspect the hub announces under. (default "rrc.hub")
dest_name = "rrc.hub"

# Announce the rrc.hub destination immediately at startup. When false,
# the first announce waits a full announce_interval. (default true)
announce_on_start = true

# How often the hub re-announces itself so relays keep a fresh path.
# (default "30m")
#
# Be careful lowering this. The hub announces TWO destinations on this
# period — rrc.hub, and lxmf.delivery half an interval behind it — so it
# is one packet flooded across the mesh every announce_interval/2,
# forever, and public transport nodes police it.
# An RNS interface with announce_rate_target set counts violations per
# destination and applies a penalty past announce_rate_grace, which in
# practice means your hub gets throttled or dropped by the node you rely
# on. Sustained 5-minute announces earned exactly that during testing.
#
# You do not need it faster. A client that has never heard the hub finds
# it with a path request, not by waiting for an announce, and cached
# paths outlive 30 minutes comfortably.
announce_interval = "30m"

# Hex identity hashes of server operators. A trusted identity may run
# server-op commands (/reload, /stats, /kline, ...). (default [])
trusted_identities = []

# Hex identity hashes refused at link-identify time. Combined with the
# kline list; a banned peer is sent ERROR "banned" and disconnected as
# soon as its identity is known. (default [])
banned_identities = []

# Path to the persisted room registry (rooms.toml). Empty disables room
# registration persistence. (default "")
room_registry_path = "rooms.toml"

# Rooms that exist from the moment the hub starts, so the first person
# to connect finds somewhere to be instead of an empty prompt.
# (default ["lobby"] — set to [] for none)
#
# They are created REGISTERED, which is what makes a room real when
# nobody is in it: /list shows only registered rooms, and an
# unregistered room is dropped the moment its last member parts, taking
# its transcript with it. A registered default room also means joiners
# get history replay rather than a blank slate on every restart.
#
# They get no founder and no operators — the room belongs to the hub,
# not to whoever arrives first. Anyone in trusted_identities can
# administer it. A leading "#" is accepted and ignored.
#
# A room that already exists in rooms.toml is left exactly as it is;
# this only ensures the room EXISTS, and never resets a topic, mode,
# operator or ban somebody set deliberately.
#
# Rooms listed here are exempt from room_registry_prune_after. They are
# only created at startup, so pruning one would leave it gone until the
# next restart — and /list would then advertise nothing to the next
# visitor, which is the empty-prompt problem this setting exists to
# solve. Drop a name from this list and its room becomes prunable again
# on the next tick, no restart needed.
default_rooms = ["lobby"]

# Path to the persisted kline list. Empty disables kline persistence.
# (default "")
kline_path = "klines.txt"

# A registered room with no connected members is pruned once it has been
# idle this long. Pruning is disabled if this or the interval is zero.
# (default "720h" = 30 days)
room_registry_prune_after = "720h"

# How often the prune sweep runs. (default "1h")
room_registry_prune_interval = "1h"

# How often the hub tries to deliver mentions waiting for peers who are
# not connected. (default "60s"; 0 disables the push entirely and leaves
# mentions to be delivered over RRC on the peer's next visit)
#
# Separate from room_registry_prune_interval above on purpose. These
# once shared a timer, so with its 1h default a hub would sit on
# somebody's message for up to an hour before the FIRST delivery
# attempt. Pruning stale rooms is housekeeping on a slow clock; this is
# the feature, and it needs a fast one.
mention_push_interval = "60s"

# Time-to-live for a room invite created by /invite. (default "15m")
room_invite_timeout = "15m"

# Include the member-hash list in JOINED/PARTED broadcasts. (default false)
include_joined_member_list = false

# Hub-initiated keepalive. (defaults: ping_interval "30s",
# ping_timeout "60s")
#
# LEAVE THESE ON unless you know why you are turning them off. A zero
# ping_interval disables hub PINGs *and* a zero ping_timeout disables
# tearing a link down for a missing PONG — so the hub never learns that
# a client vanished and lists dead peers as present in a room forever.
# Everything that asks "is this person here?" is then wrong, and
# mention_notify worst of all: the people most in need of an offline
# notification (dropped link, killed app, dead battery) are exactly the
# ones the hub still believes are sitting in the room.
ping_interval = "30s"
ping_timeout = "60s"

# Allow large payloads to transfer as RNS Resources (greeting/MOTD over
# 512 bytes, inbound RESOURCE_ENVELOPE handling). (default true)
enable_resource_transfer = true

# Largest RNS Resource the hub will accept from a client, in bytes.
# (default 262144)
max_resource_bytes = 262144

# Maximum number of un-concluded inbound resource expectations a single
# session may have pending at once. (default 8)
max_pending_resource_expectations = 8

# How long a pending inbound resource expectation lives before the
# reaper drops it. (default "30s")
resource_expectation_ttl = "30s"

# --- room history -----------------------------------------------------
#
# Off by default. Turning it on means the hub keeps plaintext room
# conversation on disk for the retention window, which is an operator's
# decision — the hub already sees every message in order to relay it,
# but keeping it is a different promise to your users than relaying it.
#
# When enabled, a client joining a room is replayed the last few
# messages so it lands in a conversation rather than an empty screen,
# and /history asks for more. Nothing about this needs a client change:
# a replay is ordinary MSG traffic bracketed by NOTICEs, and /history is
# an ordinary slash command.
history_enabled = false

# Where transcripts live. One directory per room, one append-only file
# per room per UTC day. (default "history")
history_path = "history"

# How long a message stays replayable. (default "168h" — seven days)
history_retention = "168h"

# Storage bounds. Whichever binds first evicts oldest-day-first; the
# current day is never evicted, so a busy room loses its past rather
# than the conversation in progress.
history_max_bytes_per_room = 4194304     # (default 4 MiB)
history_max_total_bytes = 134217728      # (default 128 MiB)

# What a client is replayed automatically when it joins. Keep these
# small: a client may be on a LoRa link where a week of backlog is
# minutes of airtime. This is a taste of the conversation, not an
# archive — /history is how a client asks for the rest.
history_replay_count = 10                # (default 10; 0 disables the join replay)
history_replay_bytes = 2048              # (default 2048)

# Bounds on one /history request.
history_pull_count = 100                 # (default 100)
history_pull_bytes = 16384               # (default 16384)

# --- mention notifications --------------------------------------------
#
# On by default. A message that names someone — "@alice", or "@" plus
# 6+ characters of their identity hash — reaches them even if they were
# not in the room:
#
#   * in the room already  -> nothing; they got the message itself
#   * connected elsewhere  -> a NOTICE right away
#   * not connected        -> held, and delivered when they next connect
#   * not connected, and mention_lxmf on -> sent to their LXMF inbox,
#                             so they find out without coming back
#
# Resolution is deliberately conservative. An ambiguous "@name" notifies
# nobody rather than guessing; the hash-prefix form is always certain.
# With unique_nicks on (also the default) ambiguity is rare, because the
# hub grants each identity a name nobody else holds.
#
# Anyone can turn this off for themselves with /notify off, and check
# whether it reaches them with /notify test.
# Make the hub GRANT a nickname rather than accept one: the first
# identity to claim a name keeps it, and a later claimant becomes sam1,
# sam2, and so on. A name is owned by an identity, so it survives
# disconnection and comes back to its owner. (default true)
#
# On by default because the alternative is not "names are flexible" but
# "@mentions silently reach nobody": resolution declines rather than
# guess between two people answering to the same name, and says nothing
# about having declined.
#
# The peer directory is what makes ownership outlive a disconnection, so
# with mention_notify = false uniqueness holds among connected sessions
# only.
unique_nicks = true

# The hub's lxmf.delivery destination — the address notifications are
# sent FROM — announces as "<name>(noreply)", derived from name above.
# There is no setting for it.
#
# Deriving it rather than letting an operator choose is deliberate.
# Whether that address reads replies is a fact about the software, not a
# preference: a free-form name could be made indistinguishable from a
# person, which is the confusion this exists to prevent, and every hub
# spelling the same property differently would leave users nothing to
# recognise. The name is truncated to fit if necessary — the "(noreply)"
# is never what gets dropped. The rrc.hub announce keeps the full name.

# Notice when somebody is named, and hold it for them. (default true)
#
# On by default. It was off, which meant "@nick" silently did nothing on
# every hub whose operator had not read this far — the hub's most useful
# feature, invisible.
#
# Know what it turns on: the hub starts retaining a directory of the
# identities it has met — public key, last nickname, last seen — at
# peer_registry_path below. That record is what makes somebody
# addressable once their link is gone, and there is no way to notify an
# absent peer without it. Set false to keep no such record.
mention_notify = true

# Where the peer directory lives: the identities this hub has met, their
# public keys, their last nickname, and any mentions waiting for them.
# The keys are what make someone reachable after their link is gone.
# (default "peers.toml")
peer_registry_path = "peers.toml"

# Bounds. The directory evicts the least recently seen identity when
# full; a peer's pending mentions evict oldest-first.
max_known_peers = 2048         # (default 2048)
max_pending_mentions = 20      # per peer (default 20)
mention_snippet_bytes = 140    # how much of the message a notification quotes (default 140)

# Actually reach people who are offline, rather than only telling them
# on their next visit.
#
# A held mention is not a notification: nothing tells the person to come
# and look. With mention_lxmf on, the hub sends waiting mentions to the
# recipient's LXMF client (Sideband, MeshChat, NomadNet, the mobile
# app), which surfaces them like any other message. No RRC client
# changes.
#
# Two routes are tried, in this order:
#
#   1. DIRECT to the recipient's lxmf.delivery destination, waiting for
#      their own delivery proof. This is the one that usually works, and
#      the only one that proves anything: leaving a room is not leaving
#      the mesh, and an LXMF client is typically a background service
#      that is still there after the RRC app is closed.
#   2. STORE-AND-FORWARD via a propagation node, held until the
#      recipient's client next syncs.
#
# The address is derived from the public key the peer proved when it
# last connected, so nobody has to register anything. This assumes a
# peer uses the same identity for RRC and for LXMF — true of
# reticulum-mobile-app, not guaranteed in general. When neither route
# confirms delivery the mention simply stays queued for their next RRC
# session, so the worst case is seeing it twice.
#
# Requires mention_notify = true. (default true)
#
# On by default, with a consequence worth understanding: the hub then
# ANNOUNCES its own lxmf.delivery destination, and every messaging
# client on the mesh will list it as a contact. That is not optional —
# a recipient who has never heard that announce holds no public key to
# verify the notification's signature against, and drops it in silence.
# It announces as "<name>(noreply)" rather than the hub's own name, and
# answers anyone who messages it, so it does not pose as a person. Set false if you would rather the hub announced only rrc.hub.
mention_lxmf = true

# Where the identity behind that lxmf.delivery destination is stored.
# Created on first run. Unset = identity_path with ".lxmf" appended, so
# it lands beside the hub identity wherever you moved that to.
#
# It is a SEPARATE identity from the hub's, and that is the point. The
# two destinations always had different hashes — rrc.hub and
# lxmf.delivery are different aspects — but they used to derive from one
# key, so both announces carried the same public key and the same
# identity hash. A client that stores what it hears keyed by identity
# rather than by destination sees one entry, not two, and the later
# announce overwrites the earlier: the hub stops looking like somewhere
# you can join a room and turns into a "(noreply)" contact. Nothing on
# the sending side can observe that — announces are unacknowledged — so
# the identities are simply kept apart.
#
# UPGRADING: a hub that ran an older build generates this key on first
# start with the new one, which CHANGES its notification address.
# Recipients see notifications from a new sender, and replies to the old
# address go nowhere. Set this to your identity_path to keep the old
# address instead of getting a new one.
lxmf_identity_path = ""

# Pin a propagation node by its lxmf.propagation destination hash (32
# hex characters). Unset = auto-select.
#
# Pin one when you actually know one — your own node, or your
# community's. A pinned node is a trust decision the hub will not
# quietly fall back from, and it is the only way to be sure the message
# is waiting somewhere your users' clients actually sync from.
lxmf_propagation_node = ""

# How many auto-selected propagation nodes one notification is left
# with. Ignored when lxmf_propagation_node is pinned. (default 2, max 5)
#
# More than one because nothing in an announce says which node a given
# recipient syncs from, so a single pick out of the dozens announcing on
# a public mesh is close to a guess — and a message parked on the wrong
# node is never seen. Copies cost you airtime and cost the recipient
# nothing: LXMF dedupes on message_id, so a message that arrives twice
# is shown once. This is the FALLBACK route, reached only after direct
# delivery has already failed.
lxmf_propagation_fanout = 2

[hub.limits]
# Client-facing limits advertised in WELCOME and enforced hub-side.
max_nick_bytes = 32                  # (default 32)
max_room_name_bytes = 64             # (default 64)
max_msg_body_bytes = 350             # (default 350)
max_rooms_per_session = 32           # (default 32)
rate_limit_msgs_per_minute = 240     # token-bucket capacity (default 240)

# One or more Reticulum transport attachments. Only tcp_client is
# supported — attach to any rnsd TCPServerInterface. Use a public
# transport node so clients on the wider mesh can reach the hub.
#
# There is no default, and this placeholder is not a working address:
# which mesh a hub joins is the operator's decision, and shipping a
# example pointed at somebody else's node would quietly make it
# everyone's. Put your own transport node here, or one you have been
# invited to use.
[[interfaces]]
type = "tcp_client"
address = "your-transport-node.example.net:4965"
